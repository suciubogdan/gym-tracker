[project]
name = "gym-tracker"
version = "0.1.0"
description = "Local-first strength plan management with deliberate Garmin Connect synchronization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "garminconnect[workout]>=0.3.11,<0.4",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516",
]

[project.scripts]
gym = "gym_tracker.cli:app"
gym-mcp = "gym_tracker.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gym_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

