person: bogdan
priorities: [upper_body, chest, back, shoulders, balanced_lower_body]
schedule:
  workouts_per_week: 4
weekly_schedule:
  monday: A
  tuesday: B
  thursday: C
  saturday: D
phase:
  type: introduction
  sessions: 8
  progression_aggressiveness: conservative
workouts:
  A:
    name: Bogdan Full Body A
    emphasis: [chest, back]
    exercises:
      - {id: barbell_bench_press, sets: 2, rep_range: [8, 12], target_weight_kg: 40, progression: double_progression, rest_seconds: 120, pairing_key: bench_1}
      - {id: lat_pulldown, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 90, pairing_key: cable_1}
      - {id: goblet_squat, sets: 2, rep_range: [8, 12], target_weight_kg: 20, progression: double_progression, rest_seconds: 90}
      - {id: dumbbell_shoulder_press, sets: 2, rep_range: [8, 12], target_weight_kg: 12, progression: double_progression, rest_seconds: 90, pairing_key: bench_2}
      - {id: romanian_deadlift, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 120}
      - {id: dumbbell_lateral_raise, sets: 2, rep_range: [10, 15], target_weight_kg: 6, progression: double_progression, rest_seconds: 60}
  B:
    name: Bogdan Full Body B
    emphasis: [back, shoulders]
    exercises:
      - {id: seated_cable_row, sets: 2, rep_range: [8, 12], target_weight_kg: 30, progression: double_progression, rest_seconds: 90, pairing_key: cable_1}
      - {id: incline_dumbbell_bench_press, sets: 2, rep_range: [8, 12], target_weight_kg: 14, progression: double_progression, rest_seconds: 90, pairing_key: bench_1}
      - {id: barbell_back_squat, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 120}
      - {id: face_pull, sets: 2, rep_range: [10, 15], target_weight_kg: 15, progression: double_progression, rest_seconds: 60, pairing_key: cable_2}
      - {id: leg_curl, sets: 2, rep_range: [8, 12], target_weight_kg: 20, progression: double_progression, rest_seconds: 75}
      - {id: dumbbell_biceps_curl, sets: 2, rep_range: [8, 12], target_weight_kg: 8, progression: double_progression, rest_seconds: 60}
  C:
    name: Bogdan Full Body C
    emphasis: [chest, shoulders]
    exercises:
      - {id: incline_dumbbell_bench_press, sets: 2, rep_range: [8, 12], target_weight_kg: 14, progression: double_progression, rest_seconds: 90, pairing_key: bench_1}
      - {id: lat_pulldown, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 90, pairing_key: cable_1}
      - {id: leg_press, sets: 2, rep_range: [8, 12], target_weight_kg: 50, progression: double_progression, rest_seconds: 120}
      - {id: dumbbell_lateral_raise, sets: 2, rep_range: [10, 15], target_weight_kg: 6, progression: double_progression, rest_seconds: 60}
      - {id: barbell_hip_thrust, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 120}
      - {id: cable_tricep_kickback, sets: 2, rep_range: [10, 15], target_weight_kg: 10, progression: double_progression, rest_seconds: 60, pairing_key: cable_2}
  D:
    name: Bogdan Full Body D
    emphasis: [back, chest]
    exercises:
      - {id: barbell_bench_press, sets: 2, rep_range: [8, 12], target_weight_kg: 40, progression: double_progression, rest_seconds: 120, pairing_key: bench_1}
      - {id: seated_cable_row, sets: 2, rep_range: [8, 12], target_weight_kg: 30, progression: double_progression, rest_seconds: 90, pairing_key: cable_1}
      - {id: dumbbell_bulgarian_split_squat, sets: 2, rep_range: [8, 12], target_weight_kg: 10, progression: double_progression, rest_seconds: 90, pairing_key: bench_2}
      - {id: dumbbell_shoulder_press, sets: 2, rep_range: [8, 12], target_weight_kg: 12, progression: double_progression, rest_seconds: 90}
      - {id: romanian_deadlift, sets: 2, rep_range: [8, 12], target_weight_kg: 35, progression: double_progression, rest_seconds: 120}
      - {id: face_pull, sets: 2, rep_range: [10, 15], target_weight_kg: 15, progression: double_progression, rest_seconds: 60, pairing_key: cable_2}
workout_variants:
  home:
    A:
      name: Bogdan Home Full Body A
      emphasis: [chest, back]
      exercises:
        - {id: dumbbell_floor_press, sets: 2, rep_range: [8, 12], target_weight_kg: 10, progression: double_progression, rest_seconds: 60, pairing_key: home_dumbbells_1}
        - id: band_assisted_pull_up
          sets: 2
          rep_range: [6, 10]
          target_weight_kg: 0
          progression: manual
          rest_seconds: 60
          pairing_key: home_pull_up_1
          manual_override: true
          instructions: [Choose assistance that leaves about two good reps in reserve.]
        - {id: goblet_squat, sets: 2, rep_range: [10, 15], target_weight_kg: 16, progression: double_progression, rest_seconds: 60, pairing_key: home_kettlebell_1, equipment: {type: kettlebell, station: floor}}
        - {id: dumbbell_shoulder_press, sets: 2, rep_range: [8, 12], target_weight_kg: 8, progression: double_progression, rest_seconds: 60, pairing_key: home_dumbbells_2, equipment: {type: dumbbells, station: floor_or_couch}}
        - {id: kettlebell_deadlift, sets: 2, rep_range: [10, 15], target_weight_kg: 24, progression: double_progression, rest_seconds: 60, pairing_key: home_kettlebell_2}
    B:
      name: Bogdan Home Full Body B
      emphasis: [back, shoulders]
      exercises:
        - id: kettlebell_row
          sets: 2
          rep_range: [10, 15]
          target_weight_kg: 8
          progression: double_progression
          rest_seconds: 60
          pairing_key: home_kettlebell_2
          manual_override: false
          instructions: [Complete the prescribed reps on each side.]
        - {id: push_up, sets: 2, rep_range: [8, 15], target_weight_kg: 0, progression: manual, rest_seconds: 45, pairing_key: home_floor_1, manual_override: true}
        - id: kettlebell_swing
          sets: 2
          rep_range: [12, 20]
          target_weight_kg: 16
          progression: double_progression
          rest_seconds: 60
          pairing_key: home_kettlebell_1
          instructions: [Use a crisp hip hinge; stop the set if the back starts doing the work.]
        - {id: dumbbell_lateral_raise, sets: 2, rep_range: [12, 20], target_weight_kg: 4, progression: double_progression, rest_seconds: 45, pairing_key: home_dumbbells_1}
        - {id: banded_face_pull, sets: 2, rep_range: [12, 20], target_weight_kg: 0, progression: manual, rest_seconds: 45, pairing_key: home_band_1, manual_override: true}
    C:
      name: Bogdan Home Full Body C
      emphasis: [chest, shoulders]
      exercises:
        - {id: push_up, sets: 2, rep_range: [8, 15], target_weight_kg: 0, progression: manual, rest_seconds: 45, pairing_key: home_floor_1, manual_override: true}
        - id: kettlebell_row
          sets: 2
          rep_range: [8, 12]
          target_weight_kg: 16
          progression: double_progression
          rest_seconds: 60
          pairing_key: home_kettlebell_1
          instructions: [Complete the prescribed reps on each side.]
        - {id: goblet_squat, sets: 2, rep_range: [10, 15], target_weight_kg: 16, progression: double_progression, rest_seconds: 60, pairing_key: home_kettlebell_2, equipment: {type: kettlebell, station: floor}}
        - {id: dumbbell_shoulder_press, sets: 2, rep_range: [8, 12], target_weight_kg: 8, progression: double_progression, rest_seconds: 60, pairing_key: home_dumbbells_1, equipment: {type: dumbbells, station: floor_or_couch}}
        - {id: weighted_hip_raise, sets: 2, rep_range: [10, 15], target_weight_kg: 24, progression: double_progression, rest_seconds: 60, pairing_key: home_floor_2}
    D:
      name: Bogdan Home Full Body D
      emphasis: [back, chest]
      exercises:
        - {id: dumbbell_floor_press, sets: 2, rep_range: [8, 12], target_weight_kg: 10, progression: double_progression, rest_seconds: 60, pairing_key: home_dumbbells_1}
        - id: band_assisted_pull_up
          sets: 2
          rep_range: [6, 10]
          target_weight_kg: 0
          progression: manual
          rest_seconds: 60
          pairing_key: home_pull_up_1
          manual_override: true
          instructions: [Choose assistance that leaves about two good reps in reserve.]
        - {id: kettlebell_deadlift, sets: 2, rep_range: [10, 15], target_weight_kg: 24, progression: double_progression, rest_seconds: 60, pairing_key: home_kettlebell_1}
        - {id: banded_hamstring_curl, sets: 2, rep_range: [8, 15], target_weight_kg: 0, progression: manual, rest_seconds: 60, pairing_key: home_band_2, manual_override: true}
        - {id: dumbbell_biceps_curl, sets: 2, rep_range: [10, 15], target_weight_kg: 8, progression: double_progression, rest_seconds: 45, pairing_key: home_dumbbells_2}
