person: roxana
priorities: [glutes, legs, balanced_upper_body]
schedule:
  workouts_per_week: 4
weekly_schedule:
  monday: A
  wednesday: B
  friday: C
  sunday: D
phase:
  type: introduction
  sessions: 8
  progression_aggressiveness: conservative
workouts:
  A:
    name: Roxana Full Body A
    emphasis: [glutes, quadriceps]
    exercises:
      - {id: barbell_hip_thrust, sets: 2, rep_range: [8, 12], target_weight_kg: 30, progression: double_progression, rest_seconds: 120, pairing_key: hip_thrust_1}
