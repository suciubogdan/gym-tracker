      - {id: lat_pulldown, sets: 2, rep_range: [8, 12], target_weight_kg: 25, progression: double_progression, rest_seconds: 90, pairing_key: cable_1}
      - {id: dumbbell_step_up, sets: 2, rep_range: [8, 12], target_weight_kg: 8, progression: double_progression, rest_seconds: 90, pairing_key: box_1}
      - {id: incline_dumbbell_bench_press, sets: 2, rep_range: [8, 12], target_weight_kg: 8, progression: double_progression, rest_seconds: 90, pairing_key: bench_1}
      - {id: face_pull, sets: 2, rep_range: [10, 15], target_weight_kg: 10, progression: double_progression, rest_seconds: 60, pairing_key: cable_2}
