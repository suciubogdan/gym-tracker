      - {id: dumbbell_shoulder_press, sets: 2, rep_range: [8, 12], target_weight_kg: 7, progression: double_progression, rest_seconds: 90}
      - {id: cable_tricep_kickback, sets: 2, rep_range: [10, 15], target_weight_kg: 7.5, progression: double_progression, rest_seconds: 60, pairing_key: cable_2}
  C:
